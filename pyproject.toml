[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-ai"
version = "0.1.0"
description = "Personal cybersecurity AI assistant for Termux"
requires-python = ">=3.9"
dependencies = ["requests"]

[project.scripts]
cipher-ai = "cipher.app:run"

[tool.setuptools.packages.find]
include = ["cipher*"]
